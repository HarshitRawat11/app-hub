# Netlify configuration for the app-hub project site.
#
# WHAT THIS DEPLOYS, AND WHAT IT DELIBERATELY DOES NOT
#
# app-hub itself CANNOT run on Netlify. Netlify Functions are JavaScript,
# TypeScript and Go; all three app-hub services are Python/FastAPI, and two of
# them talk to DynamoDB with an IRSA-derived identity that only exists inside
# the cluster. So this is not a deployment of the system.
#
# It is the PORTFOLIO half of the project (CLAUDE.md section 1, purpose 3): a
# permanent page describing the architecture, plus the real dashboard running
# against a stubbed API so a visitor can use it rather than look at a
# screenshot.
#
# WHY NOT POINT THE PAGE AT THE REAL CLUSTER: EKS issues a NEW API endpoint
# hostname on every cluster creation, and the cluster is destroyed every night
# by policy. A permanent link to the live system would be dead most of the time
# and aimed at a stale host the rest of it.
#
# ---------------------------------------------------------------------------
# THE HEADERS USED TO LIVE HERE. THEY ARE NOW IN site/_headers.
#
# Moved 2026-09-18. Netlify and Cloudflare Pages both read the `_headers`
# format from the published directory, so keeping the rules in a Netlify-only
# file made the hosting choice a lock-in for no benefit. With them in
# site/_headers, switching providers -- or running both -- is a dashboard
# change rather than a code change.
#
# What is left here is only what has no portable equivalent: the publish
# directory and the empty build command. Cloudflare Pages expresses the same
# two things in its own dashboard rather than in a file:
#
#     Build command:           (leave empty)
#     Build output directory:  site
#     Root directory:          (leave empty)
#
# DO NOT re-add a [[headers]] block here. Two sources of truth for the same
# headers is exactly the drift this project keeps paying for, and this one
# would be invisible: Netlify merges toml headers with _headers, so a stale
# rule here would quietly override the file everyone reads.
# ---------------------------------------------------------------------------

[build]
  # No build step. The site is hand-written static files -- no bundler, no npm
  # install, nothing to go stale or to break a deploy six months from now.
  #
  # `publish` is the umbrella repo's site/ directory. The six component
  # directories (infra/, gateway/, ...) are SEPARATE git repositories that this
  # repo gitignores, so they are not present in a Netlify checkout at all --
  # which is exactly why site/static/ vendors its two files from gateway rather
  # than referencing them across the boundary. `make validate` checks the
  # copies have not drifted.
  publish = "site"
  command = ""

# The dashboard demo talks to a stub that replaces window.fetch, so there is no
# API to redirect to and no rewrite rule here on purpose. A catch-all 200
# rewrite would make every mistyped path render the dashboard, which is how a
# broken link starts looking like a working one.
