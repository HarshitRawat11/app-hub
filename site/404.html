<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Not found — app-hub</title>
<meta name="robots" content="noindex">
<!-- SVG first: it carries its own prefers-color-scheme rules, so the
     mark follows the tab bar rather than fighting it. The PNGs are the
     fallback for Safari, which does not support SVG favicons at all, and
     icon-180 is what iOS and Android use for a home-screen shortcut. -->
<link rel="icon" href="/static/icon.svg" type="image/svg+xml">
<link rel="icon" href="/static/icon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/static/icon-180.png">
<style>
:root {
  --bg: #fbfbfa; --surface: #ffffff; --border: #e3e1dd;
  --text: #1f1e1c; --muted: #6f6c67; --accent: #2f6f4f; --radius: 8px;
  /* Two steps of the type scale defined in index.html, which is where the
     full six-step system lives. Only what this page uses is declared -- an
     unused token later reads as a system nobody follows. */
  --fs-xs: 0.78rem; --fs-md: 0.95rem;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #17171a; --surface: #1f1f23; --border: #33333a;
    --text: #ecEAE6; --muted: #9a968e; --accent: #6fc79a;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh; display: grid; place-items: center;
  background: var(--bg); color: var(--text);
  font: 16px/1.65 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  padding: 1.25rem;
}
main { max-width: 32rem; }
p.code { font-size: var(--fs-xs); letter-spacing: 0.09em; text-transform: uppercase; color: var(--muted); margin: 0 0 0.8rem; }
h1 { font-size: clamp(1.7rem, 5vw, 2.3rem); margin: 0 0 0.8rem; letter-spacing: -0.02em; }
p.lede { color: var(--muted); margin: 0 0 1.6rem; }
.actions { display: flex; flex-wrap: wrap; gap: 0.7rem; }
a.btn {
  display: inline-block; padding: 0.6rem 1.1rem; border-radius: var(--radius);
  border: 1px solid var(--border); background: var(--surface);
  color: var(--text); text-decoration: none; font-size: var(--fs-md); font-weight: 500;
}
a.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--bg); }
a.btn:hover { border-color: var(--accent); }
</style>
</head>
<body>
  <main>
    <p class="code">Error 404</p>
    <h1>That page isn't here</h1>
    <p class="lede">
      The link may be out of date, or the address mistyped. There are only two
      pages here — the project overview and the dashboard demo.
    </p>
    <div class="actions">
      <a class="btn primary" href="/">Project overview</a>
      <a class="btn" href="/demo">Dashboard demo</a>
      <a class="btn" href="https://github.com/HarshitRawat11/app-hub">Source</a>
    </div>
  </main>
</body>
</html>
